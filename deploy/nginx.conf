# JurisMon Nginx reverse proxy
#
# Installed to /etc/nginx/sites-available/jurismon by scripts/deploy.sh.
# Certbot rewrites this file to add the TLS block when you run:
#     certbot --nginx -d jurismon.com -d www.jurismon.com

upstream jurismon_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# PayPal retries webhooks on failure, so a burst is normal and must not be
# throttled into dropping a subscription event.
limit_req_zone $binary_remote_addr zone=jurismon_search:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name jurismon.com www.jurismon.com;

    access_log /var/log/nginx/jurismon.access.log;
    error_log  /var/log/nginx/jurismon.error.log;

    client_max_body_size 8M;

    # Let certbot answer the ACME challenge before the redirect applies.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://jurismon_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Search can be expensive; rate limit it but allow a generous burst.
    location /api/search {
        limit_req zone=jurismon_search burst=20 nodelay;

        proxy_pass         http://jurismon_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Never rate limit or buffer PayPal deliveries.
    location /api/webhooks/ {
        proxy_pass         http://jurismon_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # The admin dashboard is not something search engines should index.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass         http://jurismon_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/jurismon/frontend/;
        expires 7d;
        access_log off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
